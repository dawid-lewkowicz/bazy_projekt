openapi: 3.0.0
info:
  title: Burger API - System Zamówień
  version: 1.0.0
  description: Kompletny kontrakt API dla restauracji. Obsługuje architekturę CQRS (odczyty z Postgresa, logi w MongoDB, hybrydowy checkout).
servers:
  - url: http://localhost:3000
    description: Lokalny serwer
paths:
  /menu:
    get:
      summary: Pobiera pełne menu restauracji (Katalog)
      description: Zwraca listę wszystkich dostępnych burgerów wraz z ich wariantami (SKU, cena, stock) i modyfikatorami. Umożliwia filtrowanie po kategorii.
      tags:
        - Catalog
      parameters:
        - in: query
          name: cat
          schema:
            type: string
          required: false
          description: Nazwa kategorii do przefiltrowania (np. "Burgery")
      responses:
        "200":
          description: Pomyślnie pobrano menu
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MenuItem"
        "500":
          description: Wewnętrzny błąd bazy danych
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /menu/desc:
    get:
      summary: Pobiera opisy wszystkich wariantów
      description: Wyciąga tablicę samych opisów wariantów (desc) z tabeli Variant.
      tags:
        - Catalog
      responses:
        "200":
          description: Pomyślnie pobrano opisy
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  example: "Najlepszy w mieście"

  /carts/{sessionId}:
    get:
      summary: Pobiera aktywny koszyk
      description: Zwraca aktualny stan koszyka dla danej sesji z bazy MongoDB. Jeśli nie istnieje, tworzy nowy.
      tags:
        - Cart
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
          description: Unikalny identyfikator sesji klienta
      responses:
        "200":
          description: Pomyślnie pobrano koszyk
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"

  /carts/{sessionId}/items:
    post:
      summary: Dodaje pozycję do koszyka
      description: Zwiększa ilość produktu w koszyku lub dodaje nowy wariant w bazie MongoDB na podstawie aktualnych cen z PostgreSQL. Zapisuje log operacji.
      tags:
        - Cart
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - variantSku
                - quantity
              properties:
                variantSku:
                  type: string
                  example: "BUR-CL-MA"
                quantity:
                  type: integer
                  example: 1
      responses:
        "200":
          description: Zaktualizowany koszyk
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"

  /carts/{sessionId}/items/{sku}:
    delete:
      summary: Zmniejsza ilość lub usuwa produkt z koszyka
      description: Odejmuje 1 od ilości danego SKU. Jeśli ilość spadnie do 0, pozycja jest usuwana z koszyka.
      tags:
        - Cart
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
        - in: path
          name: sku
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Zaktualizowany koszyk po usunięciu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"

  /checkout/{sessionId}:
    post:
      summary: Finalizuje zamówienie (Atomowa transakcja)
      description: Atomowo zdejmuje towar ze stanu w relacyjnej bazie (Postgres) oraz czyści koszyk w chmurze (MongoDB). Posiada wbudowaną obsługę kompensacji i blokadę idempotencji.
      tags:
        - Checkout
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
          description: Unikalny identyfikator sesji klienta
      responses:
        "200":
          description: Zamówienie opłacone pomyślnie i zapisane w systemie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderSuccess"
        "400":
          description: Błąd walidacji biznesowej (np. koszyk jest pusty)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Konflikt domenowy (OVERSELL lub IDEMPOTENCY_CONFLICT)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /analytics/stats:
    get:
      summary: Pobiera zaawansowane statystyki akcji (Aggregation Pipeline)
      description: Wykonuje wieloetapową agregację w MongoDB. Oblicza częstotliwość zdarzeń i łączy je z aktywnymi koszykami.
      tags:
        - Analytics
      parameters:
        - in: query
          name: sessionId
          schema:
            type: string
          required: false
          description: Jeśli podane, zawęża statystyki do konkretnego klienta. Jeśli puste - robi statystyki globalne.
      responses:
        "200":
          description: Pomyślnie wygenerowano raport analityczny
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnalyticsResponse"

  /analytics/orders/high-value:
    get:
      summary: Pobiera opłacone zamówienia o wysokiej wartości (Raw SQL)
      description: Endpoint analityczny korzystający z bezpiecznego surowego zapytania SQL, aby wyciągnąć zamówienia powyżej zadanego limitu.
      tags:
        - Analytics
      parameters:
        - in: query
          name: min
          schema:
            type: number
          required: false
          description: Minimalna kwota zamówienia (domyślnie 50)
      responses:
        "200":
          description: Lista wartościowych zamówień
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HighValueOrder"
        "400":
          description: Błędny parametr min
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    MenuItem:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Classic Burger"
        description:
          type: string
          example: "Najlepszy burger wołowy w mieście."
        isAvailable:
          type: boolean
          example: true
        variants:
          type: array
          items:
            $ref: "#/components/schemas/Variant"

    Variant:
      type: object
      properties:
        sku:
          type: string
          example: "BUR-CL-MA"
        price:
          type: number
          format: float
          example: 25.50
        stock:
          type: integer
          example: 15
        desc:
          type: string
          example: "Mała porcja"

    Cart:
      type: object
      properties:
        sessionId:
          type: string
          example: "xyz123"
        items:
          type: array
          items:
            $ref: "#/components/schemas/CartItem"
        createdAt:
          type: string
          format: date-time

    CartItem:
      type: object
      properties:
        variantId:
          type: integer
          example: 4
        variantSku:
          type: string
          example: "BUR-CL-MA"
        price:
          type: number
          format: float
          example: 19.99
        quantity:
          type: integer
          example: 2

    OrderSuccess:
      type: object
      properties:
        id:
          type: integer
          example: 104
        status:
          type: string
          example: "PAID"
        totalAmount:
          type: number
          format: float
          example: 45.50

    HighValueOrder:
      type: object
      properties:
        id:
          type: integer
          example: 52
        status:
          type: string
          example: "PAID"
        totalAmount:
          type: number
          format: float
          example: 150.00
        createdAt:
          type: string
          format: date-time

    AnalyticsResponse:
      type: object
      properties:
        actionType:
          type: string
          example: "CHECKOUT_COMPLETED"
        totalEvents:
          type: integer
          example: 142
        lastSeenAt:
          type: string
          format: date-time
          example: "2026-05-24T14:30:00Z"
        cartsStillOpen:
          type: integer
          example: 12

    ErrorResponse:
      type: object
      properties:
        code:
          type: string
          example: "CART_EMPTY"
        error:
          type: string
          example: "Koszyk jest pusty lub nie istnieje."
        details:
          type: string
          example: "Brak dodatkowych szczegółów"
